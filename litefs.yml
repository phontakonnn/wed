# LiteFS configuration file for distributed SQLite replication
fuse:
  dir: "/litefs/data"

data:
  dir: "/var/lib/litefs"

exit-on-error: false

proxy:
  addr: ":8080"
  target: "localhost:3001"
  db: "knowledge.sqlite3"
  passthrough:
    - "*.html"
    - "*.css"
    - "*.js"
    - "*.png"
    - "*.jpg"
    - "*.svg"

exec:
  - cmd: "node /app/dist/index.js"
