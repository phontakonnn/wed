services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pkh-life-os
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DATA_DIR=/data
      - ADMIN_GATE_PIN=${ADMIN_GATE_PIN:-}
      - APP_ORIGIN=${APP_ORIGIN:-http://localhost:3001}
      - EXPECTED_ORIGIN=${EXPECTED_ORIGIN:-http://localhost:3001}
    volumes:
      - pkh-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pkh-data:
    name: pkh-life-os-data
